name: Circuit API
on:
  push:
    paths: ['circuit-api/**', 'unity/Assets/**', 'scripts/sync-mobile-assets.py', '.github/workflows/circuit-api.yml']
  pull_request:
    paths: ['circuit-api/**', 'unity/Assets/**', 'scripts/sync-mobile-assets.py', '.github/workflows/circuit-api.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuit-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: circuit-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m circuit.export
      - run: git diff --exit-code -- schemas fixtures
      - run: python ../scripts/sync-mobile-assets.py
      - run: git diff --exit-code -- ../app/src/main/assets ../unity/Assets/CircuitXR/Resources
